# Fresh installation, no accounts or privileges. Stop old Owner Auth first.
[plugin]
enabled = true
config_version = "3"
acknowledgement = ""
# Empty instance ID is generated once and persisted in the granted data directory.
instance_id = ""
# Optional absolute deployment lock override; no path needed for normal installs.
writer_lock = ""
migration_id = ""

[identity]
adapter_namespace = "host-qq"
# Empty matches Host scope=None exactly (Snowluma default), never a wildcard.
route_scope = ""
accounts = []

# Optional Vita administrators; official Host commands, no Host patch required.
# Local QQ allowlist grants only Vita wake/replan; empty grants nobody.
[management]
vita_admin_accounts = []

[roles]
entries = []

[context]
enabled = true
budget_bytes = 2048
cache_ttl_seconds = 300
planner_actor_enabled = false
alias_enabled = false
guard_mode = "context_only"

[security]
binding_challenge_enabled = false
raw_prompt_logging = false

[compatibility]
legacy_templates_enabled = false

[integrations]
enabled = false
cross_plugin_privileged_enabled = false
