name: deterministic-and-runner
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r requirements-dev.txt
      - run: .venv/Scripts/python tools/run_tests.py
      - run: .venv/Scripts/python tools/setup_host_fixture.py
      - run: python -m venv .integration/host-env
      - run: .integration/host-env/Scripts/python -m pip install -r requirements-host.txt
      - run: .integration/host-env/Scripts/python tools/run_runner_smoke.py
      - run: .integration/host-env/Scripts/python tools/run_host_smoke.py --isolated-root "${{ github.workspace }}/.integration/ci-host"
      - run: .venv/Scripts/python tools/rehearse_migration.py
      - run: .venv/Scripts/python tools/record_acceptance.py
      - run: .venv/Scripts/python tools/package.py
      - name: Preserve current CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maiidentity-checks-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/unit.xml
            docs/acceptance.json
            dist/MaiIdentity-*.zip

  linux-1-3-15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIBOT_HOST_VERSION: '1.3.15'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --upgrade maibot-plugin-sdk==2.16.0
      - name: Linux unit regressions on deployment SDK (no platform or model calls)
        run: python -m pytest tests -q -p no:cacheprovider --junitxml "${{ runner.temp }}/linux-unit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-1-3-15-${{ github.sha }}
          path: ${{ runner.temp }}/linux-unit.xml
